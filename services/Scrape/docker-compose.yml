services:
  scraper-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: scraper-fastapi-service
    ports:
      - "8765:8000"
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - .:/app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
