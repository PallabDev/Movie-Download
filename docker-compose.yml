version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: movie-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: movieuser
      POSTGRES_PASSWORD: moviepass
      POSTGRES_DB: moviedownloader
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U movieuser -d moviedownloader"]
      interval: 5s
      timeout: 5s
      retries: 5

  scrape:
    build:
      context: ./services/Scrape
      dockerfile: Dockerfile
    container_name: movie-scrape
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  app:
    build: .
    container_name: movie-app
    restart: unless-stopped
    user: "1000:1000"
    dns:
      - 8.8.8.8
      - 8.8.4.4
    ports:
      - "3000:3000"
    env_file:
      - env.txt
    environment:
      - DATABASE_URL=postgresql://movieuser:moviepass@postgres:5432/moviedownloader
      - DOCKER=true
      - DL_API_BASE_URL=http://scrape:8000
      - INNGEST_BASE_URL=http://movie-inngest:8288
      - INNGEST_EVENT_KEY=
      - INNGEST_SIGNING_KEY=
    volumes:
      - ./download:/app/download
      - bot-session:/app/bot-session
    depends_on:
      postgres:
        condition: service_healthy
      scrape:
        condition: service_started

  inngest:
    image: inngest/inngest:latest
    container_name: movie-inngest
    restart: unless-stopped
    ports:
      - "8288:8288"
    command: ["inngest", "dev", "-u", "http://app:3000/api/inngest", "--host", "0.0.0.0", "--port", "8288"]
    depends_on:
      - app

volumes:
  pgdata:
  bot-session:
