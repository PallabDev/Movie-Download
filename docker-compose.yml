version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: movie-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: movieuser
      POSTGRES_PASSWORD: moviepass
      POSTGRES_DB: moviedownloader
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U movieuser -d moviedownloader"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: movie-app
    restart: unless-stopped
    user: "1000:1000"
    dns:
      - 8.8.8.8
      - 8.8.4.4
    ports:
      - "3000:3000"
    env_file:
      - env.txt
    environment:
      - DATABASE_URL=postgresql://movieuser:moviepass@postgres:5432/moviedownloader
      - DOCKER=true
    volumes:
      - ./download:/app/download
      - bot-session:/app/bot-session
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  bot-session:
